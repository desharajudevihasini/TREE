<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 710" role="img" aria-labelledby="title desc"><title id="title">TREE data and decision flow</title><desc id="desc">Homeowner inputs flow to FastAPI, inputs and data quality, reference consumption, deterministic score and retrofit decisions, calculated money carbon and value, grounded explanation and dashboard. Public anonymised NEED feeds a separate research-only model and evidence panel.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#457a65"/></marker></defs><rect x="0" y="0" width="1150" height="710" rx="28" fill="#f7f8f2"/><text x="40" y="46" fill="#17382c" font-family="Arial,sans-serif" font-size="26" font-weight="bold">TREE · Green Home Score &amp; Retrofit Engine</text><text x="40" y="72" fill="#62796f" font-family="Arial,sans-serif" font-size="14">Lloyds PS2 · Models calculate. The optional LLM explains.</text><g font-family="Arial,sans-serif" font-size="16" text-anchor="middle" fill="#17382c">
<rect x="30" y="110" width="245" height="78" rx="12" fill="#d6eacb" stroke="#89bba6"/><text x="152" y="140" font-weight="bold">Homeowner / demo</text><text x="152" y="164" font-size="13">Property + bills + choices</text>
<rect x="340" y="110" width="235" height="78" rx="12" fill="#dbe9fa" stroke="#91acc9"/><text x="457" y="140" font-weight="bold">FastAPI / typed input</text><text x="457" y="164" font-size="13">Quality + missing-data flags</text>
