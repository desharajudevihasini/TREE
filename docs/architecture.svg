<rect x="30" y="290" width="245" height="94" rx="12" fill="#d6eacb" stroke="#89bba6"/><text x="152" y="319" font-weight="bold">Feasible retrofits</text><text x="152" y="345" font-size="13">Six upgrades + interactions</text><text x="152" y="365" font-size="13">Survey caveats</text>
